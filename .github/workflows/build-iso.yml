---
name: build-iso
on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  build-iso:
    name: build atomik ISO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Verify ISO config exists
        run: |
          test -f iso/config.toml
          test -f iso/Containerfile
          echo "ISO build config present"

      - name: Build base image
        run: podman build --network=host -t localhost/atomik-kinoite:44 -f iso/Containerfile .

      - name: Build ISO with bootc-image-builder
        run: |
          mkdir -p output
          podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v /dev/kvm:/dev/kvm \
            -v "$PWD/output":/output:z \
            -v "$PWD/iso/config.toml":/config.toml:ro,z \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --config /config.toml \
            localhost/atomik-kinoite:44

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: atomik-iso
          path: output/*.iso
          if-no-files-found: error
