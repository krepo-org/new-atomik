    - cosmic-comp
    - pipewire
    - pipewire-pulse
    - wireplumber

atomik_desktop_scheduler_services:
  silverblue:
    - gnome-shell
  kinoite:
    - kwin
  cosmic-atomic:
    - cosmic-comp

atomik_zram_config: |
  [zram0]
  zram-size = ram * 2
  compression-algorithm = zstd
  swap-priority = 100
  fs-type = swap
  same-page-compression = true
  [zram1]
  zram-size = ram / 2
  compression-algorithm = lzo-rle
  swap-priority = 50
  fs-type = swap
  same-page-compression = true

atomik_zram_udev_rules: |
  ACTION=="add", KERNEL=="zram[0-9]*", ATTR{comp_algorithm}="zstd lzo-rle lz4", ATTR{max_comp_streams}="$(nproc)", ATTR{writeback_limit}="0"

atomik_swapfile_service: |
  [Unit]
  Description=Atomik Swapfile Creator
  ConditionPathExists=!/var/swapfile

  [Service]
  Type=oneshot
  ExecStart=/sbin/btrfs filesystem mkswapfile --size 4G /var/swapfile
  RemainAfterExit=yes

  [Install]
  WantedBy=multi-user.target

atomik_swapfile_unit: |
  [Unit]
  Description=Atomik Disk Swapfile
  Requires=atomik-swapfile.service
  After=atomik-swapfile.service

  [Swap]
  What=/var/swapfile
  Priority=10

  [Install]
  WantedBy=swap.target

atomik_io_udev_rules: |
  ACTION=="add|change", KERNEL=="nvme[0-9]*", ATTR{queue/scheduler}="none", ATTR{queue/nr_requests}="64", ATTR{queue/read_ahead_kb}="256", ATTR{queue/nomerges}="2", ATTR{queue/rq_affinity}="2", ATTR{queue/iostats}="0"
  ACTION=="add|change", KERNEL=="sd[a-z]|mmcblk[0-9]*", ATTR{queue/scheduler}="bfq", ATTR{queue/nr_requests}="64", ATTR{queue/read_ahead_kb}="256", ATTR{queue/nomerges}="2", ATTR{queue/rq_affinity}="2"
  ACTION=="add|change", KERNEL=="nvme[0-9]*", ATTR{queue/max_sectors_kb}="128"
  ACTION=="add|change", KERNEL=="sd[a-z]|mmcblk[0-9]*", ATTR{queue/max_sectors_kb}="128"
  ACTION=="add|change", KERNEL=="nvme[0-9]*", ATTR{device/queue_depth}="64"
  ACTION=="add|change", KERNEL=="sd[a-z]|mmcblk[0-9]*", ATTR{device/queue_depth}="32"

atomik_thp_tmpfiles: |
  w /sys/kernel/mm/transparent_hugepage/enabled - - - - always
  w /sys/kernel/mm/transparent_hugepage/defrag - - - - never
  w /sys/kernel/mm/transparent_hugepage/khugepaged/defrag - - - - 0
  w /sys/kernel/mm/transparent_hugepage/khugepaged/alloc_sleep_millisecs - - - - 10000
  w /sys/kernel/mm/transparent_hugepage/khugepaged/scan_sleep_millisecs - - - - 10000
  w /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 512
  w /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - never
  w /sys/kernel/mm/transparent_hugepage/use_zero_page - - - - 0

atomik_desktop_scheduler_config: |
  [Service]
  OOMScoreAdjust=-1000
  IOSchedulingClass=realtime
  IOSchedulingPriority=0
  CPUSchedulingPolicy=rr
  CPUSchedulingPriority=4
  Nice=-15
  MemoryHigh=infinity
  MemoryMax=infinity
  TasksMax=16384

atomik_desktop_scheduler_config_rt: |
  [Service]
  CPUAccounting=yes
  MemoryAccounting=yes
  IOAccounting=yes
  TasksAccounting=yes
  IPAccounting=yes

atomik_default_shell: /usr/bin/fish
