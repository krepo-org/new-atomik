atomik_repositories:
  brave-browser:
    content: |
      [brave-browser]
      name=Brave Browser
      baseurl=https://brave-browser-rpm-release.s3.brave.com/$basearch
      enabled=1
      gpgcheck=1
      gpgkey=https://brave-browser-rpm-release.s3.brave.com/brave-core.asc

atomik_nix_packages:
  - discord
  - easyeffects
  - obs-studio
  - slack
  - vlc

atomik_firewall_services:
  - ssh
  - dhcpv6-client

atomik_ssh_config: |
  PermitRootLogin no
  PasswordAuthentication no
  PubkeyAuthentication yes
  X11Forwarding no
  ClientAliveInterval 300
  Compression yes
  TCPKeepAlive yes
  UseDNS no
  AllowUsers @wheel

atomik_sysctl:
  fs:
    file-max: 9223372036854775807
    inotify:
      max_user_watches: 524288
    protected_fifos: 2
    protected_hardlinks: 1
    protected_regular: 2
    protected_symlinks: 1
    suid_dumpable: 0
  kernel:
    core_uses_pid: 1
    dmesg_restrict: 1
    kptr_restrict: 2
    numa_balancing: 0
    panic: 10
    pid_max: 4194304
    printk: "3 3 3 3"
    sched_autogroup_enabled: 0
    perf_cpu_time_max_percent: 1
    perf_event_paranoid: -1
    sched_latency_ns: 6000000
    sched_migration_cost_ns: 500000
    sched_min_granularity_ns: 3000000
    sched_wakeup_granularity_ns: 4000000
    sysrq: 0
    threads-max: 1048576
    timer_migration: 0
    unprivileged_bpf_disabled: 1
  net:
    ipv4:
      conf:
        all:
          accept_redirects: 0
          accept_source_route: 0
          arp_announce: 2
          arp_ignore: 1
          send_redirects: 0
        default:
          accept_redirects: 0
          accept_source_route: 0
          send_redirects: 0
      icmp_echo_ignore_broadcasts: 1
      ip_forward: 0
      ping_group_range: "0 2147483647"
      tcp_congestion_control: bbr
      tcp_fastopen: 3
      tcp_rfc1337: 1
      tcp_syncookies: 1
      tcp_timestamps: 0
      tcp_sack: 1
      tcp_mtu_probing: 1
      tcp_slow_start_after_idle: 0
      tcp_notsent_lowat: 131072
      udp_mem: "2097152 4194304 8388608"
    core:
      default_qdisc: fq
      rmem_max: 16777216
      wmem_max: 16777216
      rmem_default: 262144
      wmem_default: 262144
      netdev_max_backlog: 5000
      optmem_max: 25165824
    ipv6:
      conf:
        all:
          accept_redirects: 0
          accept_source_route: 0
          disable_ipv6: 0
        default:
          accept_redirects: 0
          accept_source_route: 0
          disable_ipv6: 0
  vm:
    compaction_proactiveness: 0
    compact_unevictable_allowed: 0
    dirty_background_ratio: 1
    dirty_expire_centisecs: 500
    dirty_ratio: 3
    dirty_writeback_centisecs: 100
    dirtytime_expire_seconds: 200
    extfrag_threshold: 100
    max_map_count: 2147483642
    overcommit_memory: 1
    overcommit_ratio: 50
    page_cluster: 0
    page_lock_unfairness: 1
    panic_on_oom: 0
    reclaim_clean_pages: 1
    stat_interval: 5
    swappiness: 1
    vfs_cache_pressure: 100
    watermark_boost_factor: 0
    watermark_low_factor: 200
    zone_reclaim_mode: 0

atomik_limits:
  hard:
    memlock: 8388608
    nofile: 2097152
    nproc: 524288
  soft:
    memlock: 8388608
    nofile: 1048576
    nproc: 262144

atomik_sudo_config: |
  Defaults timestamp_timeout=5
  Defaults lecture=never
  Defaults passwd_timeout=0
  Defaults use_pty
  Defaults logfile="/var/log/sudo.log"

atomik_permissions:
  /boot: "0755"
  /boot/loader: "0755"
  /etc/group: "0644"
  /etc/gshadow: "0000"
  /etc/passwd: "0644"
  /etc/shadow: "0000"
  /root: "0700"

atomik_oomd_config: |
  [OOM]
  SwapUsedLimit=10%
  DefaultMemoryPressureLimit=5%
  DefaultMemoryPressureDurationSec=500ms

atomik_oomd_user_slice: |
  [Service]
  ManagedOOMMemoryPressure=kill
  ManagedOOMMemoryPressureLimit=10%
  ManagedOOMSwap=kill

atomik_oomd_protected_config: |
  [Service]
  ManagedOOMMemoryPressure=kill
  ManagedOOMMemoryPressureLimit=50%
  ManagedOOMSwap=kill
  OOMScoreAdjust=-1000

atomik_cgroup_user_slice: |
  [Slice]
  MemoryHigh=75%
  MemoryMax=90%
  TasksMax=4096

atomik_cgroup_protected_default: |
  [Service]
  MemoryHigh=infinity
  MemoryMax=infinity
  TasksMax=8192

atomik_cgroup_app_slice: |
  [Slice]
  MemoryHigh=50%
  MemoryMax=75%
  TasksMax=2048

atomik_cgroup_cpu_weight_compositor: |
  [Service]
  CPUShares=4096

atomik_cgroup_cpu_weight_app: |
  [Service]
  CPUShares=1024

atomik_oomd_protected_services:
  silverblue:
    - gdm
    - gnome-session
    - gnome-session-wayland
    - gnome-session-x11
    - gnome-shell
    - pipewire
    - pipewire-pulse
