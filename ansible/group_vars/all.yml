    - file: kwinrc
      group: kwin
      key: Opacity
      value: ""
    - file: kwinrc
      group: Blur
      key: Blur
      value: ""
    - file: kwinrc
      group: Compositing
      key: OpenGLIsUnsafe
      value: "true"
  baloo:
