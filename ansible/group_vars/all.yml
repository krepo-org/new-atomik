atomik_repositories:
  brave-browser:
    content: |
      [brave-browser]
      name=Brave Browser
      baseurl=https://brave-browser-rpm-release.s3.brave.com/$basearch
      enabled=1
      gpgcheck=1
      gpgkey=https://brave-browser-rpm-release.s3.brave.com/brave-core.asc

atomik_firewall_services:
  - ssh
  - dhcpv6-client

atomik_ssh_config: |
  PermitRootLogin no
  PasswordAuthentication no
  PubkeyAuthentication yes
  X11Forwarding no
  ClientAliveInterval 300
  Compression yes
  TCPKeepAlive yes
  UseDNS no
  AllowUsers @wheel

atomik_sysctl:
  fs:
    file-max: 9223372036854775807
    inotify:
      max_user_instances: 1024
      max_user_watches: 2097152
    protected_fifos: 2
    protected_hardlinks: 1
    protected_regular: 2
    protected_symlinks: 1
    suid_dumpable: 0
  kernel:
    core_uses_pid: 1
    dmesg_restrict: 1
    kptr_restrict: 2
    numa_balancing: 0
    panic: 10
    printk: "3 3 3 3"
    sched_autogroup_enabled: 0
    perf_event_paranoid: -1
    sysrq: 0
    timer_migration: 0
    unprivileged_bpf_disabled: 1
  net:
    ipv4:
      conf:
        all:
          accept_redirects: 0
          accept_source_route: 0
          arp_announce: 2
          arp_ignore: 1
          send_redirects: 0
        default:
          accept_redirects: 0
          accept_source_route: 0
          send_redirects: 0
      icmp_echo_ignore_broadcasts: 1
      ip_forward: 0
      ping_group_range: "0 2147483647"
      tcp_congestion_control: bbr
      tcp_fastopen: 3
      tcp_rfc1337: 1
      tcp_syncookies: 1
      tcp_timestamps: 0
      tcp_sack: 1
      tcp_mtu_probing: 1
      tcp_slow_start_after_idle: 0
    core:
      default_qdisc: fq
    ipv6:
      conf:
        all:
          accept_redirects: 0
          accept_source_route: 0
          disable_ipv6: 0
        default:
          accept_redirects: 0
          accept_source_route: 0
          disable_ipv6: 0
  vm:
    compaction_proactiveness: 0
    compact_unevictable_allowed: 0
    dirty_background_ratio: 1
    dirty_expire_centisecs: 500
    dirty_ratio: 3
    dirty_writeback_centisecs: 100
    dirtytime_expire_seconds: 200
    extfrag_threshold: 100
    overcommit_memory: 1
    page_cluster: 0
    page_lock_unfairness: 1
    panic_on_oom: 0
    reclaim_clean_pages: 1
    stat_interval: 5
    swappiness: 1
    vfs_cache_pressure: 100
    watermark_boost_factor: 0
    watermark_low_factor: 200
    zone_reclaim_mode: 0

atomik_limits:
  hard:
    memlock: 8388608
    nofile: 2097152
    nproc: 524288
  soft:
    memlock: 8388608
    nofile: 1048576
    nproc: 262144

atomik_sudo_config: |
  Defaults timestamp_timeout=5
  Defaults lecture=never
  Defaults passwd_timeout=0
  Defaults use_pty
  Defaults logfile="/var/log/sudo.log"

atomik_permissions:
  /boot: "0755"
  /boot/loader: "0755"
  /etc/group: "0644"
  /etc/gshadow: "0000"
  /etc/passwd: "0644"
  /etc/shadow: "0000"
  /root: "0700"

atomik_vconsole_font: "lat2-16"

atomik_cgroup_cpu_weight_compositor: |
  [Service]
  CPUShares=4096

atomik_cgroup_cpu_weight_app: |
  [Service]
  CPUShares=1024

atomik_oomd_protected_services:
  cosmic-atomic:
    - cosmic-comp
    - cosmic-session
    - cosmic-panel
    - cosmic-greeter
    - cosmic-osd
    - pipewire
    - pipewire-pulse
    - wireplumber

atomik_desktop_scheduler_services:
  cosmic-atomic:
    - cosmic-comp
    - cosmic-session
    - cosmic-panel

atomik_zram_config: |
  [zram0]
  zram-size = ram * 2
  compression-algorithm = zstd
  swap-priority = 100
  fs-type = swap
  same-page-compression = true
  [zram1]
  zram-size = ram / 2
  compression-algorithm = lzo-rle
  swap-priority = 50
  fs-type = swap
  same-page-compression = true

atomik_zram_udev_rules: |
  ACTION=="add", KERNEL=="zram[0-9]*", ATTR{comp_algorithm}="zstd lzo-rle lz4", ATTR{max_comp_streams}="$(nproc)", ATTR{writeback_limit}="0"

atomik_default_shell: /usr/bin/fish

atomik_critical_services:
  cosmic-atomic:
    - NetworkManager
    - systemd-resolved
    - upower
    - bluetooth
    - sshd
    - cosmic-greeter
    - cosmic-osd

atomik_masked_services:
  - abrtd
  - abrt-journal-core
  - abrt-oops
  - abrt-vmcore
  - abrt-xorg
  - cups
  - cups-browsed
  - fedora-policy
  - geoclue
  - gssproxy
  - ModemManager
  - packagekit
  - packagekit-offline-update
  - pmie
  - pmlogger
  - rpcbind
  - rpc-statd

atomik_alsa_power_save: |
  options snd_hda_intel power_save=0
  options snd_hda_intel power_save_controller=N

atomik_logind_conf: |
  [Login]
  IdleAction=ignore
  IdleActionSec=infinity
  HandleSuspendKey=ignore
  HandleHibernateKey=ignore
  HandleLidSwitch=ignore
  HandleLidSwitchExternalPower=ignore
  HandleLidSwitchDocked=ignore
  PowerKeyIgnoreInhibited=yes
  SuspendKeyIgnoreInhibited=yes
  HibernateKeyIgnoreInhibited=yes

atomik_dpms_udev_rules: |
  ACTION=="add", SUBSYSTEM=="drm", KERNEL=="card*", RUN+="/usr/bin/xset -dpms 2>/dev/null || true"

atomik_wifi_restart_service: |
  [Unit]
  Description=Restart NetworkManager if WiFi not connected
  After=network-online.target
  Wants=network-online.target
  ConditionPathExists=!/run/atomik-wifi-checked

  [Service]
  Type=oneshot
  ExecStart=/bin/bash -c 'sleep 5 && nmcli -t -f TYPE,STATE connection show | grep -q "wifi:activated" || systemctl restart NetworkManager'
  RemainAfterExit=yes

  [Install]
  WantedBy=multi-user.target

atomik_battery_charge_threshold: 85

atomik_battery_threshold_script: |
  #!/bin/bash
  for bat in /sys/class/power_supply/BAT*/charge_control_end_threshold; do
    [ -f "$bat" ] && echo {{ atomik_battery_charge_threshold }} > "$bat"
  done

atomik_battery_threshold_service: |
  [Unit]
  Description=Set battery charge threshold to {{ atomik_battery_charge_threshold }}%
  Before=graphical.target

  [Service]
  Type=oneshot
  ExecStart=/usr/local/bin/atomik-battery-threshold.sh
  RemainAfterExit=yes

  [Install]
  WantedBy=multi-user.target

atomik_cosmic_environment: |
  DISPLAY=:0
  ELECTRON_OZONE_PLATFORM_HINT=x11
  ELECTRON_OZONE_PLATFORM=x11
  OZONE_PLATFORM_HINT=x11
  GDK_BACKEND=wayland,x11
  QT_QPA_PLATFORM=wayland,xcb
  QT_WAYLAND_DISABLE_WINDOWDECORATION=1
  MOZ_ENABLE_WAYLAND=1
  SDL_VIDEODRIVER=wayland,x11
  CLUTTER_BACKEND=wayland
  GBM_BACKEND=wayland
  WLR_NO_HARDWARE_CURSORS=1
  WLR_RENDERER_VULKAN=0
  LIBGL_ALWAYS_SOFTWARE=0
  __GL_SYNC_TO_VBLANK=1
  __GL_SYNC_DISPLAY=1
  __GLX_VENDOR_LIBRARY_NAME=mesa
  MESA_GL_VERSION_OVERRIDE=4.6
  MESA_GLSL_VERSION_OVERRIDE=460
  VDPAU_DRIVER=vaapi
