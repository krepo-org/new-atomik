      group: Basic Settings
      key: Indexing-Enabled
      value: "false"
  power:
    - file: powermanagementprofilesrc
      group: AC
      key: acHandleButtonEvent
      value: "1"
    - file: powermanagementprofilesrc
      group: Battery
      key: batteryHandleButtonEvent
      value: "1"
    - file: powermanagementprofilesrc
      group: AC
      key: idleTimeout
      value: "300000"
    - file: powermanagementprofilesrc
      group: AC
      key: suspendThenHibernate
      value: "false"
  taskbar:
