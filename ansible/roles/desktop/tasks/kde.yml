---
- name: Detect KDE config tool
  ansible.builtin.shell: |
    if command -v kwriteconfig6 >/dev/null 2>&1; then
      echo "kwriteconfig6"
    elif command -v kwriteconfig5 >/dev/null 2>&1; then
      echo "kwriteconfig5"
    else
      echo "none"
    fi
  become: true
  become_user: "{{ atomik_user }}"
  register: kwriteconfig_result
  changed_when: false

- name: Set KDE config tool
  ansible.builtin.set_fact:
    kde_config_tool: "{{ kwriteconfig_result.stdout }}"

- name: Apply KDE settings
  ansible.builtin.shell: |
    {{ kde_config_tool }} --file {{ item.file }} --group {{ item.group }} --key {{ item.key }} '{{ item.value | default('') }}'
  become: true
  become_user: "{{ atomik_user }}"
  loop: >-
    {{ atomik_kde_settings.animations | default([]) +
       atomik_kde_settings.baloo | default([]) +
       atomik_kde_settings.power | default([]) +
       atomik_kde_settings.taskbar | default([]) +
       atomik_kde_settings.telemetry | default([]) +
       atomik_kde_settings.wallet | default([]) +
       atomik_kde_settings.restrictions | default([]) +
       atomik_kde_settings.compositor | default([]) +
       atomik_kde_settings.notifications | default([]) +
       atomik_kde_settings.effects | default([]) +
       atomik_kde_settings.kded | default([]) +
       atomik_kde_settings.lock | default([]) +
       atomik_kde_settings.screen_edges | default([]) }}
  loop_control:
    label: "{{ item.file }}/{{ item.group }}/{{ item.key }}"
  when: item.value is defined and kde_config_tool != 'none'

- name: Remove obsolete KDE animation keys
  ansible.builtin.shell: |
    {{ kde_config_tool }} --file kwinrc --group kwin --key Opacity --delete
    {{ kde_config_tool }} --file kwinrc --group Blur --key Blur --delete
  become: true
  become_user: "{{ atomik_user }}"
  when: kde_config_tool != 'none'

- name: Deploy KDE power profiles
  ansible.builtin.copy:
    content: "{{ atomik_kde_powerdevil }}"
    dest: "/home/{{ atomik_user }}/.config/powerdevilrc"
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"
  become: true

- name: Disable unwanted KDE autostart entries
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Hidden=true
    dest: "/home/{{ atomik_user }}/.config/autostart/{{ item }}"
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"
  loop: "{{ atomik_kde_disabled_autostart | default([]) }}"
  loop_control:
    label: "{{ item }}"
  become: true

- name: Mask crashing X11 legacy daemon user units
  ansible.builtin.shell: |
    systemctl --user --machine={{ atomik_user }}@.host mask plasma-kaccess.service
    systemctl --user --machine={{ atomik_user }}@.host mask plasma-xembedsniproxy.service
    systemctl --user --machine={{ atomik_user }}@.host mask plasma-gmenudbusmenuproxy.service
  become: true
  changed_when: false

- name: Create KDE environment config directory
  ansible.builtin.file:
    path: "/home/{{ atomik_user }}/.config/environment.d"
    state: directory
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0755"
  become: true

- name: Deploy KDE environment config
  ansible.builtin.copy:
    content: "{{ atomik_kde_environment }}"
    dest: "/home/{{ atomik_user }}/.config/environment.d/atomik-kde.conf"
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"
  become: true

- name: Deploy minimal look-and-feel package
  ansible.builtin.copy:
    src: look-and-feel/
    dest: "/home/{{ atomik_user }}/.local/share/plasma/look-and-feel/"
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"
  become: true

- name: Activate minimal look-and-feel
  ansible.builtin.shell: QT_QPA_PLATFORM=offscreen lookandfeeltool --apply com.atomik.desktop
  become: true
  become_user: "{{ atomik_user }}"
  register: lnf_result
  changed_when: lnf_result.rc == 0
  failed_when: false

- name: Hide stock look-and-feel themes via tmpfiles bind mounts
  ansible.builtin.copy:
    content: |
      {% for theme in atomik_hidden_look_and_feel_themes | default([]) %}
      d /run/atomik-hidden-themes/{{ theme }} 0755 root root -
      {% endfor %}
      {% for theme in atomik_hidden_look_and_feel_themes | default([]) %}
      b /usr/share/plasma/look-and-feel/{{ theme }} - - - - /run/atomik-hidden-themes/{{ theme }}
      {% endfor %}
    dest: /etc/tmpfiles.d/atomik-hidden-themes.conf
    mode: "0644"
  become: true

- name: Apply hidden look-and-feel theme bind mounts
  ansible.builtin.shell: |
    {% for theme in atomik_hidden_look_and_feel_themes | default([]) %}
    mkdir -p "/run/atomik-hidden-themes/{{ theme }}"
    mount --bind "/run/atomik-hidden-themes/{{ theme }}" "/usr/share/plasma/look-and-feel/{{ theme }}" 2>/dev/null || true
    {% endfor %}
  become: true
  changed_when: false

- name: Deploy KDE panel setup script
  ansible.builtin.copy:
    src: panels.py
    dest: /tmp/kde_panels.py
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"
  become: true

- name: Run KDE panel setup
  ansible.builtin.shell: |
    systemctl --user stop plasma-plasmashell 2>/dev/null || true
    killall -9 plasmashell 2>/dev/null || true
    sleep 1
    python3 /tmp/kde_panels.py
    systemctl --user start plasma-plasmashell
  become: true
  become_user: "{{ atomik_user }}"
  register: panel_result
  changed_when: panel_result.rc == 0
  failed_when: false
