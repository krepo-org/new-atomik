---

- name: Skip in containers
  ansible.builtin.include_role:
    name: shared
    tasks_from: skip_in_containers.yml

- name: Refresh rpm-ostree metadata
  ansible.builtin.shell: rpm-ostree refresh-md --force
  become: true
  changed_when: false

- name: Manage RPM-OSTREE packages
  ansible.builtin.include_tasks: rpm_ostree.yml
