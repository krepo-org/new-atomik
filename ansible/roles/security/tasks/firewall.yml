---
- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Add firewall services
  ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/roles/security/tasks/firewall/add_firewall_service.fish {{ item }}"
  loop: "{{ atomik_firewall_services }}"
  register: firewall_result
  changed_when: firewall_result.rc == 0
  failed_when: firewall_result.rc != 0
