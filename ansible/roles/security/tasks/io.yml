---

- name: Deploy udev IO rules
  ansible.builtin.template:
    src: io_udev_rules.conf.j2
    dest: /etc/udev/rules.d/99-atomik-io.rules
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev

- name: Deploy THP config
  ansible.builtin.template:
    src: thp.conf.j2
    dest: /etc/tmpfiles.d/99-atomik-thp.conf
    owner: root
    group: root
    mode: "0644"

- name: Deploy custom runtime directories config
  ansible.builtin.template:
    src: custom-runtime-dirs.conf.j2
    dest: /etc/tmpfiles.d/custom-runtime-dirs.conf
    owner: root
    group: root
    mode: "0644"

- name: Apply mount tuning
  ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/roles/security/tasks/io/apply_mount_tuning.fish"
  register: mount_result
  changed_when: false
  failed_when: mount_result.rc != 0
