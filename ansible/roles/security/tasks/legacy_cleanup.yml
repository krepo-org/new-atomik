---

- name: Stop and disable legacy swapfile service
  ansible.builtin.systemd:
    name: bora-swapfile.service
    state: stopped
    enabled: false
    masked: true

- name: Remove legacy swapfile service files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/bora-swapfile.service
    - /etc/systemd/system/multi-user.target.wants/bora-swapfile.service

- name: Find legacy OOMD dropins
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "99-bora-oomd.conf"
    file_type: file
  register: legacy_oomd_dropins

- name: Remove legacy OOMD dropins
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ legacy_oomd_dropins.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Reload systemd

- name: Find legacy scheduler dropins
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "99-bora-scheduler.conf"
    file_type: file
  register: legacy_sched_dropins

- name: Remove legacy scheduler dropins
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ legacy_sched_dropins.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Reload systemd

- name: Find legacy OOMD main config
  ansible.builtin.find:
    paths: /etc/systemd/oomd.conf.d
    patterns: "99-bora.conf"
    file_type: file
  register: legacy_oomd_config

- name: Remove legacy OOMD main config
  ansible.builtin.file:
    path: /etc/systemd/oomd.conf.d/99-bora.conf
    state: absent
  when: legacy_oomd_config.files | length > 0

- name: Find legacy sysctl configs
  ansible.builtin.find:
    paths: /etc/sysctl.d
    patterns: "99-bora-*.conf"
    file_type: file
  register: legacy_sysctl

- name: Remove legacy sysctl configs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ legacy_sysctl.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find legacy limits config
  ansible.builtin.find:
    paths: /etc/security/limits.d
    patterns: "99-bora.conf"
    file_type: file
  register: legacy_limits

- name: Remove legacy limits config
  ansible.builtin.file:
    path: /etc/security/limits.d/99-bora.conf
    state: absent
  when: legacy_limits.files | length > 0

- name: Find legacy container hook
  ansible.builtin.find:
    paths: /etc/profile.d
    patterns: "z-bora-container-hook.sh"
    file_type: file
  register: legacy_hook

- name: Remove legacy container hook
  ansible.builtin.file:
    path: /etc/profile.d/z-bora-container-hook.sh
    state: absent
  when: legacy_hook.files | length > 0

- name: Find legacy status file
  ansible.builtin.find:
    paths: /etc
    patterns: "bora-status.json"
    file_type: file
  register: legacy_status

- name: Remove legacy status file
  ansible.builtin.file:
    path: /etc/bora-status.json
    state: absent
  when: legacy_status.files | length > 0

- name: Find legacy fail2ban config
  ansible.builtin.find:
    paths: /etc/fail2ban/jail.d
    patterns: "bora.local"
    file_type: file
  register: legacy_fail2ban

- name: Remove legacy fail2ban config
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/bora.local
    state: absent
  when: legacy_fail2ban.files | length > 0

- name: Find legacy swapfile unit
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "var-swapfile.swap"
    file_type: file
  register: legacy_swapfile_unit

- name: Remove legacy swapfile unit
  ansible.builtin.file:
    path: /etc/systemd/system/var-swapfile.swap
    state: absent
  when: legacy_swapfile_unit.files | length > 0

- name: Clean legacy transaction temp dirs
  ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/ansible/roles/security/tasks/legacy_cleanup/clean_transaction_temp.fish"
  environment:
    ATOMIK_USER: "{{ atomik_user }}"
  become: true
  become_user: "{{ atomik_user }}"

- name: Remove legacy container hook volume from user containers.conf
  ansible.builtin.lineinfile:
    path: "/var/home/{{ atomik_user }}/.config/containers/containers.conf"
    regexp: '.*z-bora-container-hook.*'
    state: absent

- name: Remove legacy container hook volume from system containers.conf
  ansible.builtin.lineinfile:
    path: /etc/containers/containers.conf
    regexp: '.*z-bora-container-hook.*'
    state: absent
  become: true

- name: Fix legacy volume_path in system containers.conf
  ansible.builtin.replace:
    path: /etc/containers/containers.conf
    regexp: '/var/lib/containers/storage/bora/'
    replace: '/var/lib/containers/storage/'
  become: true

- name: Fix legacy paths in system storage-nested.conf
  ansible.builtin.replace:
    path: /etc/containers/storage-nested.conf
    regexp: '/storage/bora/'
    replace: '/storage/'
  become: true
