---

- name: Set podman user paths
  ansible.builtin.set_fact:
    _podman_user_home: "/var/home/{{ atomik_user }}"
    _podman_user_config: "/var/home/{{ atomik_user }}/.config/containers"
    _podman_user_storage: "/var/home/{{ atomik_user }}/.local/share/containers/storage"

- name: Resolve user UID
  ansible.builtin.command: getent passwd {{ atomik_user }}
  register: _podman_user_uid_result
  changed_when: false

- name: Set user UID fact
  ansible.builtin.set_fact:
    _podman_user_uid: "{{ _podman_user_uid_result.stdout.split(':')[2] }}"

- name: Deploy system containers.conf
  ansible.builtin.template:
    src: containers-system-dynamic.conf.j2
    dest: /etc/containers/containers.conf
    owner: root
    group: root
    mode: "0644"

- name: Ensure user containers config directory exists
  ansible.builtin.file:
    path: "{{ _podman_user_config }}"
    state: directory
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0700"

- name: Deploy system nested storage config
  ansible.builtin.copy:
    content: |
      [storage]
      driver = "overlay"
      graphroot = "/var/lib/containers/storage-nested"
      runroot = "/run/containers/storage-nested"

      [storage.options.overlay]
      mount_program = ""
    dest: /etc/containers/storage-nested.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy user nested storage config
  ansible.builtin.copy:
    content: |
      [storage]
      driver = "overlay"
      graphroot = "{{ _podman_user_storage }}-nested"
      runroot = "/run/user/{{ _podman_user_uid }}/containers-nested"

      [storage.options.overlay]
      mount_program = "/usr/bin/fuse-overlayfs"
    dest: "{{ _podman_user_config }}/storage-nested.conf"
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"
  become: true

- name: Deploy user containers.conf
  ansible.builtin.template:
    src: containers-user-dynamic.conf.j2
    dest: "{{ _podman_user_config }}/containers.conf"
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0644"

- name: Ensure podman events directory exists (system)
  ansible.builtin.file:
    path: /var/lib/containers/storage/events
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure podman events directory exists (user)
  ansible.builtin.file:
    path: "{{ _podman_user_storage }}/events"
    state: directory
    owner: "{{ atomik_user }}"
    group: "{{ atomik_user }}"
    mode: "0755"

- name: Ensure /run/media exists for removable media mounts
  ansible.builtin.file:
    path: /run/media
    state: directory
    mode: "0755"

- name: Remove pasta package if present
  ansible.builtin.command: rpm-ostree uninstall -y --apply-live --idempotent pasta
  register: _pasta_remove
  changed_when: "'Removed' in _pasta_remove.stdout or 'Queued' in _pasta_remove.stdout"
  become: true

- name: Verify slirp4netns networking works
  ansible.builtin.command: >
    podman run --rm --network=slirp4netns alpine:latest echo ok
  register: _podman_verify
  changed_when: false
  become: false
  failed_when: _podman_verify.rc != 0
