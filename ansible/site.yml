---
- name: Configure Fedora Atomic system
  hosts: localhost
  gather_facts: true

  pre_tasks:
    - name: Detect real user
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/shared/get_real_user.fish"
      register: user_result
      changed_when: false
      tags: [always]

    - name: Set real user
      ansible.builtin.set_fact:
        atomik_user: "{{ user_result.stdout }}"
      tags: [always]

    - name: Display info
      ansible.builtin.debug:
        msg: "Desktop: COSMIC, User: {{ atomik_user }}"
      tags: [always]

  roles:
    - role: bootstrap
      become: true
      tags: [bootstrap]
    - role: repos
      become: true
      tags: [repos]
    - role: packages
      become: true
      tags: [packages]
    - role: security
      become: true
      tags: [security]
    - role: desktop
      tags: [desktop]
