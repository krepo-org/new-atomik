---
- name: Setup business environment
  hosts: localhost
  become: false
  gather_facts: true

  pre_tasks:
    - name: Detect real user
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/shared/get_real_user.fish"
      register: user_result
      changed_when: false
    - name: Set real user fact
      ansible.builtin.set_fact:
        ansible_user_id: "{{ user_result.stdout }}"

  vars:
    business_flatpaks:
      - com.slack.Slack

    business_flatpak_overrides:
      com.slack.Slack:
        env:
          ELECTRON_OZONE_PLATFORM_HINT: x11
        sockets:
          - x11
        nosockets:
          - fallback-x11
        filesystems:
          - xdg-cache:create
          - xdg-config:create

  tasks:
    - name: Skip in containers
      ansible.builtin.include_role:
        name: shared
        tasks_from: skip_in_containers.yml

    - name: Install business Flatpaks
      community.general.flatpak:
        name: "{{ item }}"
        remote: flathub
        state: present
        method: user
      loop: "{{ business_flatpaks }}"
      loop_control:
        label: "{{ item }}"
      become: true
      become_user: "{{ ansible_user_id }}"
      register: flatpak_install
      changed_when: flatpak_install is changed

    - name: Reset business Flatpak overrides
      ansible.builtin.shell: "flatpak override --user --reset {{ item }}"
      loop: "{{ business_flatpaks }}"
      loop_control:
        label: "{{ item }}"
      become: true
      become_user: "{{ ansible_user_id }}"
      register: business_reset_result
      changed_when: business_reset_result.rc == 0
      failed_when: business_reset_result.rc != 0

    - name: Apply business Flatpak overrides
      ansible.builtin.shell: |
        OVERRIDE_CMD="flatpak override --user"
        {% for s in item.value.sockets | default([]) %}
        OVERRIDE_CMD="$OVERRIDE_CMD --socket={{ s }}"
        {% endfor %}
        {% for s in item.value.nosockets | default([]) %}
        OVERRIDE_CMD="$OVERRIDE_CMD --nosocket={{ s }}"
        {% endfor %}
        {% for key, val in item.value.env.items() %}
        OVERRIDE_CMD="$OVERRIDE_CMD --env={{ key }}={{ val }}"
        {% endfor %}
        {% for fs in item.value.filesystems | default([]) %}
        OVERRIDE_CMD="$OVERRIDE_CMD --filesystem={{ fs }}"
        {% endfor %}
        $OVERRIDE_CMD {{ item.key }}
      loop: "{{ business_flatpak_overrides | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: override_result
      changed_when: override_result.rc == 0
      failed_when: override_result.rc != 0
      when: item.value is defined
