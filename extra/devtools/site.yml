---
- name: Setup development tools
  hosts: localhost
  gather_facts: true
  become: false

  vars:
    devtools_bash_d: "~/.bashrc.d"
    devtools_fish_conf_d: "~/.config/fish/conf.d"
    devtools_bash_d_link: "~/.bash.d"
    devtools_bashrc: "~/.bashrc"
    devtools_jetbrains_alias_bash: |
      if command -v dex >/dev/null 2>&1; then
          alias jetbrains-toolbox="dex $HOME/.local/share/applications/jetbrains-toolbox.desktop"
          alias idea="dex $HOME/.local/share/applications/jetbrains-idea-2962247c-c234-4f4f-b69a-1ba655f7a676.desktop"
          alias android-studio="dex $HOME/.local/share/applications/jetbrains-studio-dc863395-7115-4ff2-948e-3f642bc481dd.desktop"
      fi
    devtools_jetbrains_alias_fish: |
      if command -v dex >/dev/null 2>&1
          alias jetbrains-toolbox "dex $HOME/.local/share/applications/jetbrains-toolbox.desktop"
          alias idea "dex $HOME/.local/share/applications/jetbrains-idea-2962247c-c234-4f4f-b69a-1ba655f7a676.desktop"
          alias android-studio "dex $HOME/.local/share/applications/jetbrains-studio-dc863395-7115-4ff2-948e-3f642bc481dd.desktop"
      end
    devtools_bashrc_d_block: |
      # BEGIN ATOMIK BASHRC.D
      if [ -d ~/.bashrc.d ]; then
          for rc in ~/.bashrc.d/*; do
              if [ -f "$rc" ]; then
                  . "$rc"
              fi
          done
      fi
      # END ATOMIK BASHRC.D
    devtools_nvm_sh: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      [ -s "$NVM_DIR/bash_completion" ] && \. "$HOME/.nvm/bash_completion"
    devtools_nvm_fish: |
      set -gx NVM_DIR "$HOME/.nvm"
      if test -d "$NVM_DIR"
          if test -f "$NVM_DIR/alias/default"
              set -l default_ver (cat "$NVM_DIR/alias/default")
              for ver_dir in $NVM_DIR/versions/node/v$default_ver*
                  if test -d "$ver_dir/bin"
                      fish_add_path "$ver_dir/bin"
                      break
                  end
              end
          end
      end
      function nvm
          set -gx NVM_DIR "$HOME/.nvm"
          set -l cmd "source \$NVM_DIR/nvm.sh && nvm $argv && echo \"__ENV_START__\" && env"
          set -l res (bash -c "$cmd")
          set -l in_env 0
          for line in $res
              if test "$line" = "__ENV_START__"
                  set in_env 1
                  continue
              end
              if test $in_env -eq 1
                  set -l kv (string split -m 1 "=" $line)
                  if test (count $kv) -eq 2
                      set -l key $kv[1]
                      set -l val $kv[2]
                      if string match -q "NVM_*" "$key"; or string match -q "NODE_*" "$key"; or test "$key" = "PATH"
                          if test "$key" = "PATH"
                              set -l path_list (string split ":" $val)
                              set -gx PATH $path_list
                          else
                              set -gx $key $val
                          end
                      end
                  end
              else
                  echo "$line"
              end
          end
      end
    devtools_pnpm_sh: |
      export PNPM_HOME="$HOME/.local/share/pnpm"
      case ":$PATH:" in
        *":$PNPM_HOME/bin:"*) ;;
        *) export PATH="$PNPM_HOME/bin:$PATH" ;;
      esac
    devtools_pnpm_fish: |
      set -gx PNPM_HOME "$HOME/.local/share/pnpm"
      if test -d "$PNPM_HOME"
          fish_add_path "$PNPM_HOME/bin"
      end
    devtools_cargo_sh: |
      if [ -f "$HOME/.cargo/env" ]; then
          . "$HOME/.cargo/env"
      fi
    devtools_cargo_fish: |
      if test -d "$HOME/.cargo/bin"
          fish_add_path "$HOME/.cargo/bin"
      end
    devtools_opencode_sh: |
      export PATH="$HOME/.opencode/bin:$PATH"
    devtools_opencode_fish: |
      if test -d "$HOME/.opencode/bin"
          fish_add_path "$HOME/.opencode/bin"
      end
    devtools_sdkman_sh: |
      export SDKMAN_DIR="$HOME/.sdkman"
      [[ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ]] && source "$SDKMAN_DIR/bin/sdkman-init.sh"
    devtools_sdkman_fish: |
      set -gx SDKMAN_DIR "$HOME/.sdkman"
      if test -d "$SDKMAN_DIR"
          for candidate_bin in $SDKMAN_DIR/candidates/*/current/bin
              if test -d "$candidate_bin"
                  fish_add_path "$candidate_bin"
              end
          end
      end
      function sdk
          set -gx SDKMAN_DIR "$HOME/.sdkman"
          set -l cmd "source \$SDKMAN_DIR/bin/sdkman-init.sh && sdk $argv && echo \"__ENV_START__\" && env"
          set -l res (bash -c "$cmd")
          set -l in_env 0
          for line in $res
              if test "$line" = "__ENV_START__"
                  set in_env 1
                  continue
              end
              if test $in_env -eq 1
                  set -l kv (string split -m 1 "=" $line)
                  if test (count $kv) -eq 2
                      set -l key $kv[1]
                      set -l val $kv[2]
                      if string match -q "SDKMAN_*" "$key"; or test "$key" = "PATH"
                          if test "$key" = "PATH"
                              set -l path_list (string split ":" $val)
                              set -gx PATH $path_list
                          else
                              set -gx $key $val
                          end
                      end
                  end
              else
                  echo "$line"
              end
          end
      end

  tasks:
    - name: Ensure bashrc.d directory
      ansible.builtin.file:
        path: "{{ devtools_bash_d | expanduser }}"
        state: directory
        mode: "0755"

    - name: Ensure fish conf.d directory
      ansible.builtin.file:
        path: "{{ devtools_fish_conf_d | expanduser }}"
        state: directory
        mode: "0755"

    - name: Migrate .bash.d to .bashrc.d
      ansible.builtin.shell: |
        if [ -d "{{ devtools_bash_d_link | expanduser }}" ] && [ ! -L "{{ devtools_bash_d_link | expanduser }}" ]; then
          cp -rP "{{ devtools_bash_d_link | expanduser }}"/* "{{ devtools_bash_d | expanduser }}/" || true
          rm -rf "{{ devtools_bash_d_link | expanduser }}"
        fi
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Symlink .bash.d to .bashrc.d
      ansible.builtin.file:
        src: ".bashrc.d"
        dest: "{{ devtools_bash_d_link | expanduser }}"
        state: link
        force: true

    - name: Deploy JetBrains aliases
      ansible.builtin.copy:
        content: "{{ devtools_jetbrains_alias_bash }}"
        dest: "{{ devtools_bash_d | expanduser }}/jetbrains.sh"
        mode: "0644"
      become: false

    - name: Deploy JetBrains fish aliases
      ansible.builtin.copy:
        content: "{{ devtools_jetbrains_alias_fish }}"
        dest: "{{ devtools_fish_conf_d | expanduser }}/jetbrains.fish"
        mode: "0644"
      become: false

    - name: Ensure ATOMIK BASHRC.D block in .bashrc
      ansible.builtin.blockinfile:
        path: "{{ devtools_bashrc | expanduser }}"
        marker: "# {mark} ATOMIK BASHRC.D"
        block: "{{ devtools_bashrc_d_block }}"
        create: yes
        mode: "0644"

    - name: Install nvm
      ansible.builtin.shell: >
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      args:
        executable: /bin/bash
        creates: "~/.nvm/nvm.sh"
      register: nvm_result
      changed_when: nvm_result.rc == 0
      failed_when: false

    - name: Deploy nvm shell configs
      ansible.builtin.copy:
        content: "{{ devtools_nvm_sh }}"
        dest: "{{ devtools_bash_d | expanduser }}/nvm.sh"
        mode: "0644"
      become: false

    - name: Deploy nvm fish config
      ansible.builtin.copy:
        content: "{{ devtools_nvm_fish }}"
        dest: "{{ devtools_fish_conf_d | expanduser }}/nvm.fish"
        mode: "0644"
      become: false

    - name: Install pnpm
      ansible.builtin.shell: >
        export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && npm install -g pnpm
      args:
        executable: /bin/bash
        creates: "~/.local/share/pnpm/bin/pnpm"
      register: pnpm_result
      changed_when: pnpm_result.rc == 0
      failed_when: false

    - name: Deploy pnpm shell configs
      ansible.builtin.copy:
        content: "{{ devtools_pnpm_sh }}"
        dest: "{{ devtools_bash_d | expanduser }}/pnpm.sh"
        mode: "0644"
      become: false

    - name: Deploy pnpm fish config
      ansible.builtin.copy:
        content: "{{ devtools_pnpm_fish }}"
        dest: "{{ devtools_fish_conf_d | expanduser }}/pnpm.fish"
        mode: "0644"
      become: false

    - name: Install rustup
      ansible.builtin.shell: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        executable: /bin/bash
        creates: "~/.cargo/bin/cargo"
      register: rustup_result
      changed_when: rustup_result.rc == 0
      failed_when: false

    - name: Deploy cargo shell configs
      ansible.builtin.copy:
        content: "{{ devtools_cargo_sh }}"
        dest: "{{ devtools_bash_d | expanduser }}/cargo.sh"
        mode: "0644"
      become: false

    - name: Deploy cargo fish config
      ansible.builtin.copy:
        content: "{{ devtools_cargo_fish }}"
        dest: "{{ devtools_fish_conf_d | expanduser }}/cargo.fish"
        mode: "0644"
      become: false

    - name: Install opencode
      ansible.builtin.shell: >
        mkdir -p "$HOME/.opencode/bin" && curl -fsSL https://opencode.ai/install | sh
      args:
        executable: /bin/bash
        creates: "~/.opencode/bin/opencode"
      register: opencode_result
      changed_when: opencode_result.rc == 0
      failed_when: false

    - name: Deploy opencode shell configs
      ansible.builtin.copy:
        content: "{{ devtools_opencode_sh }}"
        dest: "{{ devtools_bash_d | expanduser }}/opencode.sh"
        mode: "0644"
      become: false

    - name: Deploy opencode fish config
      ansible.builtin.copy:
        content: "{{ devtools_opencode_fish }}"
        dest: "{{ devtools_fish_conf_d | expanduser }}/opencode.fish"
        mode: "0644"
      become: false

    - name: Install sdkman
      ansible.builtin.shell: >
        curl -s "https://get.sdkman.io" | bash
      args:
        executable: /bin/bash
        creates: "~/.sdkman/bin/sdkman-init.sh"
      register: sdkman_result
      changed_when: sdkman_result.rc == 0
      failed_when: false

    - name: Deploy sdkman shell configs
      ansible.builtin.copy:
        content: "{{ devtools_sdkman_sh }}"
        dest: "{{ devtools_bash_d | expanduser }}/sdkman.sh"
        mode: "0644"
      become: false

    - name: Deploy sdkman fish config
      ansible.builtin.copy:
        content: "{{ devtools_sdkman_fish }}"
        dest: "{{ devtools_fish_conf_d | expanduser }}/sdkman.fish"
        mode: "0644"
      become: false
