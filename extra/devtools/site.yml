---
- name: Setup development tools
  hosts: localhost
  gather_facts: true
  become: false

  pre_tasks:
    - name: Detect container environment
      ansible.builtin.set_fact:
        in_container: >-
          {{ ansible_facts.get('virtualization_type', '') == 'container' or
             ansible_facts.get('file', {}).get('/run/.toolboxenv', {}).get('exists', false) }}

  vars:
    devtools_bash_d: "~/.bashrc.d"
    devtools_fish_conf_d: "~/.config/fish/conf.d"
    devtools_bashrc: "~/.bashrc"
    devtools_clean_home_script: "~/.local/share/atomik/clean_home.fish"
    devtools_clean_home_service: |
      [Unit]
      Description=Atomik daily home cleanup
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/fish %h/.local/share/atomik/clean_home.fish
      TimeoutStartSec=300

      [Install]
      WantedBy=default.target
    devtools_clean_home_timer: |
      [Unit]
      Description=Atomik daily home cleanup timer

      [Timer]
      OnCalendar=daily
      Persistent=true

      [Install]
      WantedBy=timers.target
    devtools_bashrc_d_block: |
      # BEGIN ATOMIK BASHRC.D
      if [ -d ~/.bashrc.d ]; then
          for rc in ~/.bashrc.d/*; do
              if [ -f "$rc" ]; then
                  . "$rc"
              fi
          done
      fi
      # END ATOMIK BASHRC.D
    devtools_pnpm_sh: |
      export PNPM_HOME="$HOME/.local/share/pnpm"
      case ":$PATH:" in
        *":$PNPM_HOME/bin:"*) ;;
        *) export PATH="$PNPM_HOME/bin:$PATH" ;;
      esac
    devtools_pnpm_fish: |
      set -gx PNPM_HOME "$HOME/.local/share/pnpm"
      if test -d "$PNPM_HOME"
          fish_add_path "$PNPM_HOME/bin"
      end
    devtools_cargo_sh: |
      if [ -f "$HOME/.cargo/env" ]; then
          . "$HOME/.cargo/env"
      fi
    devtools_cargo_fish: |
      if test -d "$HOME/.cargo/bin"
          fish_add_path "$HOME/.cargo/bin"
      end
    devtools_opencode_sh: |
      export PATH="$HOME/.opencode/bin:$PATH"
    devtools_opencode_fish: |
      if test -d "$HOME/.opencode/bin"
          fish_add_path "$HOME/.opencode/bin"
      end

  tasks:
    - name: Ensure bashrc.d directory
      ansible.builtin.file:
        path: "{{ devtools_bash_d | expanduser }}"
        state: directory
        mode: "0755"
      when: not in_container

    - name: Ensure fish conf.d directory
      ansible.builtin.file:
        path: "{{ devtools_fish_conf_d | expanduser }}"
        state: directory
        mode: "0755"

    - name: Ensure ATOMIK BASHRC.D block in .bashrc
      ansible.builtin.blockinfile:
        path: "{{ devtools_bashrc | expanduser }}"
        marker: "# {mark} ATOMIK BASHRC.D"
        block: "{{ devtools_bashrc_d_block }}"
        create: true
        mode: "0644"
      when: not in_container

    - name: Clean home directory
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/extra/devtools/site/clean_home.fish"
      changed_when: false

    - name: Ensure atomik user share directory
      ansible.builtin.file:
        path: "{{ devtools_clean_home_script | expanduser | dirname }}"
        state: directory
        mode: "0755"

    - name: Deploy clean_home script to user share
      ansible.builtin.copy:
        src: "{{ inventory_dir }}/../../scripts/extra/devtools/site/clean_home.fish"
        dest: "{{ devtools_clean_home_script | expanduser }}"
        mode: "0755"

    - name: Create systemd user directory
      ansible.builtin.file:
        path: "~/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Deploy atomik-clean-home service
      ansible.builtin.copy:
        content: "{{ devtools_clean_home_service }}"
        dest: "~/.config/systemd/user/atomik-clean-home.service"
        mode: "0644"

    - name: Deploy atomik-clean-home timer
      ansible.builtin.copy:
        content: "{{ devtools_clean_home_timer }}"
        dest: "~/.config/systemd/user/atomik-clean-home.timer"
        mode: "0644"

    - name: Enable and start atomik-clean-home timer
      ansible.builtin.systemd_service:
        name: atomik-clean-home.timer
        scope: user
        enabled: true
        state: started

    - name: Enable lingering for user timers
      ansible.builtin.command: "loginctl enable-linger {{ lookup('env', 'USER') }}"
      changed_when: false

    - name: Install pnpm
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/extra/devtools/site/install_pnpm.fish"
      args:
        creates: "~/.local/share/pnpm/bin/pnpm"
      register: pnpm_result
      changed_when: pnpm_result.rc == 0

    - name: Deploy pnpm shell configs
      ansible.builtin.copy:
        content: "{{ devtools_pnpm_sh }}"
        dest: "{{ devtools_bash_d | expanduser }}/pnpm.sh"
        mode: "0644"
      become: false

    - name: Deploy pnpm fish config
      ansible.builtin.copy:
        content: "{{ devtools_pnpm_fish }}"
        dest: "{{ devtools_fish_conf_d | expanduser }}/pnpm.fish"
        mode: "0644"
      become: false

    - name: Install rustup
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/extra/devtools/site/install_rustup.fish"
      args:
        creates: "~/.cargo/bin/cargo"
      register: rustup_result
      changed_when: rustup_result.rc == 0

    - name: Deploy cargo shell configs
      ansible.builtin.copy:
        content: "{{ devtools_cargo_sh }}"
        dest: "{{ devtools_bash_d | expanduser }}/cargo.sh"
        mode: "0644"
      become: false

    - name: Deploy cargo fish config
      ansible.builtin.copy:
        content: "{{ devtools_cargo_fish }}"
        dest: "{{ devtools_fish_conf_d | expanduser }}/cargo.fish"
        mode: "0644"
      become: false

    - name: Install opencode
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/extra/devtools/site/install_opencode.fish"
      args:
        creates: "~/.opencode/bin/opencode"
      register: opencode_result
      changed_when: opencode_result.rc == 0

    - name: Deploy opencode shell configs
      ansible.builtin.copy:
        content: "{{ devtools_opencode_sh }}"
        dest: "{{ devtools_bash_d | expanduser }}/opencode.sh"
        mode: "0644"
      become: false

    - name: Deploy opencode fish config
      ansible.builtin.copy:
        content: "{{ devtools_opencode_fish }}"
        dest: "{{ devtools_fish_conf_d | expanduser }}/opencode.fish"
        mode: "0644"
      become: false
