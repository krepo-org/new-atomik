---
- name: Setup Flatpak environment
  hosts: localhost
  become: false
  gather_facts: true

  pre_tasks:
    - name: Detect real user
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/shared/get_real_user.fish"
      register: user_result
      changed_when: false
    - name: Set real user fact
      ansible.builtin.set_fact:
        ansible_user_id: "{{ user_result.stdout }}"

  vars:
    flatpak_remotes:
      - name: flathub
        url: https://dl.flathub.org/repo/flathub.flatpakrepo
        state: present
    atomik_flatpaks:
      - org.kde.Kile
      - org.videolan.VLC
      - com.discordapp.Discord
      - com.usebottles.bottles
      - eu.betterbird.Betterbird
      - com.github.wwmm.easyeffects

  tasks:
    - name: Skip in containers
      ansible.builtin.include_role:
        name: shared
        tasks_from: skip_in_containers.yml

    - name: Ensure flatpak is installed
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/extra/flatpak/site/ensure_flatpak_installed.fish"
      register: flatpak_install
      changed_when: "'Queued' in flatpak_install.stdout"
      failed_when: flatpak_install.rc != 0

    - name: Apply live changes if needed
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/shared/apply_live_changes.fish"
      register: apply_flatpak
      changed_when: apply_flatpak.rc == 0
      failed_when: apply_flatpak.rc != 0
      when: flatpak_install.changed

    - name: Ensure Flatpak remotes
      community.general.flatpak_remote:
        name: "{{ item.name }}"
        flatpakrepo_url: "{{ item.url }}"
        state: "{{ item.state }}"
        method: user
      loop: "{{ flatpak_remotes }}"
      loop_control:
        label: "{{ item.name }}"
      become: true
      become_user: "{{ ansible_user_id }}"
      register: remote_result
      changed_when: remote_result is changed

    - name: Install Atomik Flatpaks
      community.general.flatpak:
        name: "{{ item }}"
        remote: flathub
        state: present
        method: user
      loop: "{{ atomik_flatpaks }}"
      loop_control:
        label: "{{ item }}"
      become: true
      become_user: "{{ ansible_user_id }}"
      register: flatpak_app_install
      changed_when: flatpak_app_install is changed

    - name: Detect installed Electron Flatpak apps
      ansible.builtin.shell: |
        flatpak list --app --columns=application 2>/dev/null | while read app; do
          if flatpak info --show-metadata "$app" 2>/dev/null | grep -q "org.electronjs.Electron2.BaseApp"; then
            echo "$app"
          fi
        done
      register: electron_apps_result
      become: true
      become_user: "{{ ansible_user_id }}"
      changed_when: false

    - name: Set Electron Flatpak apps fact
      ansible.builtin.set_fact:
        detected_electron_apps: "{{ electron_apps_result.stdout_lines | default([]) }}"

    - name: Apply base Electron override to all detected apps
      ansible.builtin.shell: |
        flatpak override --user --reset {{ item }}
        flatpak override --user \
          --nosocket=fallback-x11 \
          --socket=wayland \
          --socket=x11 \
          --env=ELECTRON_OZONE_PLATFORM_HINT=x11 \
          --filesystem=xdg-cache:create \
          --filesystem=xdg-config:create \
          {{ item }}
      loop: "{{ detected_electron_apps }}"
      loop_control:
        label: "{{ item }}"
      become: true
      become_user: "{{ ansible_user_id }}"
      register: electron_override_result
      changed_when: electron_override_result.rc == 0
      failed_when: electron_override_result.rc != 0

    - name: Ensure Discord settings directory exists
      ansible.builtin.file:
        path: "~/.var/app/com.discordapp.Discord/config/discord"
        state: directory
        owner: "{{ ansible_user_id }}"
        mode: "0755"
      become: true
      become_user: "{{ ansible_user_id }}"

    - name: Create Discord flags file
      ansible.builtin.copy:
        content: |
          --ozone-platform=x11
          --use-gl=egl
        dest: "~/.var/app/com.discordapp.Discord/config/discord-flags.conf"
        owner: "{{ ansible_user_id }}"
        mode: "0644"
      become: true
      become_user: "{{ ansible_user_id }}"

    - name: Enable Discord hardware acceleration
      ansible.builtin.lineinfile:
        path: "~/.var/app/com.discordapp.Discord/config/discord/settings.json"
        regexp: '"enableHardwareAcceleration"\s*:\s*false'
        line: '  "enableHardwareAcceleration": true,'
        insertafter: '"IS_MINIMIZED"'
        create: true
        owner: "{{ ansible_user_id }}"
        mode: "0644"
      become: true
      become_user: "{{ ansible_user_id }}"

    - name: Create systemd user directory for Electron overrides
      ansible.builtin.include_role:
        name: shared
        tasks_from: ensure_systemd_user_dir.yml
      vars:
        shared_user: "{{ ansible_user_id }}"

    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "~/.local/bin"
        state: directory
        owner: "{{ ansible_user_id }}"
        mode: "0755"
      become: true
      become_user: "{{ ansible_user_id }}"

    - name: Deploy fix-electron-overrides script
      ansible.builtin.copy:
        src: "{{ inventory_dir }}/../../scripts/extra/flatpak/site/fix-electron-overrides.sh"
        dest: "~/.local/bin/fix-electron-overrides"
        owner: "{{ ansible_user_id }}"
        mode: "0755"
      become: true
      become_user: "{{ ansible_user_id }}"

    - name: Deploy fix-electron-flatpak service
      ansible.builtin.copy:
        content: |
          [Unit]
          description=Apply Flatpak Electron sandbox overrides

          [Service]
          type=oneshot
          execstart=%h/.local/bin/fix-electron-overrides-host

          [Install]
          wantedby=default.target
        dest: "~/.config/systemd/user/fix-electron-flatpak.service"
        owner: "{{ ansible_user_id }}"
        mode: "0644"
      become: true
      become_user: "{{ ansible_user_id }}"

    - name: Deploy fix-electron-flatpak path unit
      ansible.builtin.copy:
        content: |
          [Unit]
          description=Monitor Flatpak app directory for changes

          [Path]
          DirectoryModified=/var/lib/flatpak/app
          Unit=fix-electron-flatpak.service

          [Install]
          wantedBy=default.target
        dest: "~/.config/systemd/user/fix-electron-flatpak.path"
        owner: "{{ ansible_user_id }}"
        mode: "0644"
      become: true
      become_user: "{{ ansible_user_id }}"

    - name: Deploy fix-electron-flatpak timer (boot trigger)
      ansible.builtin.copy:
        content: |
          [Unit]
          description=Apply Electron overrides after boot

          [Timer]
          onbootsec=30s

          [Install]
          wantedBy=timers.target
        dest: "~/.config/systemd/user/fix-electron-flatpak.timer"
        owner: "{{ ansible_user_id }}"
        mode: "0644"
      become: true
      become_user: "{{ ansible_user_id }}"

    - name: Enable fix-electron-flatpak path unit
      ansible.builtin.systemd_service:
        name: fix-electron-flatpak.path
        scope: user
        enabled: true
        state: started
      become: true
      become_user: "{{ ansible_user_id }}"

    - name: Enable fix-electron-flatpak timer
      ansible.builtin.systemd_service:
        name: fix-electron-flatpak.timer
        scope: user
        enabled: true
        state: started
      become: true
      become_user: "{{ ansible_user_id }}"

    - name: Run fix-electron-overrides now
      ansible.builtin.command: "{{ ansible_user_id == 'root' | ternary('/root', '/home/' + ansible_user_id) }}/.local/bin/fix-electron-overrides"
      become: true
      become_user: "{{ ansible_user_id }}"
      changed_when: false
