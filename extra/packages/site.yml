---
- name: Install system packages via rpm-ostree
  hosts: localhost
  become: true
  gather_facts: true

  vars:
    atomik_rpm_install:
      - powertop
      - brave-origin
      - host-spawn
      - fish
      - fontawesome-fonts-all
      - google-noto-color-emoji-fonts
      - tuned
      - tuned-utils
      - ujust
      - ripgrep

  tasks:
    - name: Skip in containers
      ansible.builtin.include_role:
        name: shared
        tasks_from: skip_in_containers.yml

    - name: Save toolbox container list
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/shared/save_toolbox_list.fish"
      register: toolbox_before
      changed_when: false

    - name: Refresh rpm-ostree metadata
      ansible.builtin.shell: rpm-ostree refresh-md --force
      changed_when: false

    - name: Install packages via rpm-ostree
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/extra/packages/site/install_packages_rpm_ostree.fish"
      environment:
        ATOMIK_RPM_INSTALL: "{{ atomik_rpm_install | join(' ') }}"
      register: rpm_install_result
      changed_when: "'Queued' in rpm_install_result.stdout"
      failed_when: rpm_install_result.rc != 0 and 'already installed' not in rpm_install_result.stdout

    - name: Check if live changes are needed
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/shared/check_live_changes.fish"
      register: pending_changes
      changed_when: false

    - name: Apply live changes
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/shared/apply_live_changes.fish"
      register: apply_result
      changed_when: apply_result.rc == 0
      failed_when: apply_result.rc != 0
      when: pending_changes.rc == 0

    - name: Verify toolbox containers preserved
      ansible.builtin.shell: "fish {{ inventory_dir }}/../../scripts/shared/verify_toolbox.fish"
      environment:
        TOOLBOX_BEFORE: "{{ toolbox_before.stdout }}"
      register: toolbox_verify
      changed_when: false
      failed_when: toolbox_verify.rc != 0 and toolbox_verify.stdout != "no_toolbox_containers"
      when: apply_result.changed

    - name: Warn about missing toolbox containers
      ansible.builtin.debug:
        msg: "Missing toolbox containers after apply-live: {{ toolbox_verify.stdout }}"
      when:
        - toolbox_verify.stdout_lines is defined
        - toolbox_verify.stdout_lines | length > 0
        - toolbox_verify.stdout != "no_toolbox_containers"
